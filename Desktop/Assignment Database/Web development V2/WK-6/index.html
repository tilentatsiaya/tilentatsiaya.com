<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>JavaScript and DOM Manipulation</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="container">
        <h1>JavaScript Practice Project</h1>

        <div class="card">
            <h2>Conditional Statements</h2>
            <p id="ageCheck"></p>
        </div>

        <div class="card">
            <h2>Functions</h2>
            <p id="rectangleArea"></p>
            <p id="greeting"></p>
        </div>

        <div class="card">
            <h2>Loops</h2>
            <p><strong>For Loop:</strong></p>
            <p id="forLoop"></p>
            <p><strong>While Loop:</strong></p>
            <p id="whileLoop"></p>
        </div>

        <div class="card">
            <h2>DOM Manipulation</h2>
            <button id="changeTextBtn">Change Text</button>
            <p id="textChange">This text will change when you click the button.</p>
            <button id="toggleColorBtn">Toggle Color</button>
            <p id="colorText">Click the button to change my color!</p>
        </div>

        <div class="card">
            <h2>Dynamic Content</h2>
            <input type="text" id="newItem" placeholder="Enter a new item">
            <button id="addItemBtn">Add Item</button>
            <ul id="itemList">
                <li>Learn JavaScript</li>
                <li>Practice Coding</li>
            </ul>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
